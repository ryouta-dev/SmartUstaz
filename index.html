<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmartУстаз ТиПО</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
/* Layout: ledger-style workbench. Slim header with language and theme switches, three views (Создать, Образцы, Результат), bottom tab bar on phones, tabs above the content on wide screens. */
:root{
  --bg:#EDF1EE; --surface:#FAFBF9; --ink:#14201B; --ink-2:#4B5A53; --rule:#C9D3CD;
  --accent:#1D5C4B; --accent-ink:#FFFFFF; --accent-soft:#D7E8E1;
  --red:#A93226; --red-soft:#F6E1DD; --amber-soft:#F3EBD2; --amber:#7A5A12;
  --slide-bg:#14201B; --slide-fg:#E6EEE9; --slide-accent:#7CCBB0;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Bitter',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#17211C; --ink:#E6EEE9; --ink-2:#9DB0A6; --rule:#2C3A33;
    --accent:#58B79B; --accent-ink:#06130E; --accent-soft:#1D3229;
    --red:#E58B7D; --red-soft:#3A1F1B; --amber-soft:#332B14; --amber:#E3C675;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --ink:#E6EEE9; --ink-2:#9DB0A6; --rule:#2C3A33;
  --accent:#58B79B; --accent-ink:#06130E; --accent-soft:#1D3229;
  --red:#E58B7D; --red-soft:#3A1F1B; --amber-soft:#332B14; --amber:#E3C675;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.25;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.head{display:flex;align-items:center;gap:10px;padding-block:12px 4px}
.logo{width:36px;height:36px;color:var(--accent);flex:none}
.brand{min-width:0;margin-right:auto}
.brand b{font-family:var(--font-display);font-size:19px;display:block;line-height:1.1}
.brand span{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;display:block}
@media (max-width:430px){.brand span{display:none}}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex:none}
.seg button{min-height:44px;min-width:50px;padding:0 10px;background:var(--surface);border:0;font:600 13px var(--font-mono);cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--rule);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.ai-state{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);padding-block:2px 0}
.ai-state i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rule);margin-right:6px}
.ai-state.ok i{background:var(--accent)}
.ai-state.off i{background:var(--red)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;border-top:3px solid transparent;min-height:60px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;display:grid;justify-items:center;align-content:center;gap:2px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
@media (min-width:760px){
  .tabs{position:static;display:flex;gap:4px;border:0;background:none;padding:12px 0 0}
  .tabs button{border:1px solid var(--rule);border-radius:6px 6px 0 0;background:var(--surface);padding:0 22px;min-height:48px;display:flex;gap:8px;align-items:center;font-size:15px}
  .tabs button[aria-selected="true"]{border-top-width:3px}
}

/* generic */
.view{display:grid;gap:16px;padding-top:16px}
.view[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px;min-width:0}
.lbl{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lead{color:var(--ink-2);max-width:62ch}
.mono{font-family:var(--font-mono);font-size:12px}
.row{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:1fr 1fr 1fr}}
.row>*{min-width:0}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field label{font-size:14px;font-weight:600}
input[type=text],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rule);background:var(--bg);border-radius:6px;font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.btn{min-height:48px;padding:0 20px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{border-color:var(--red);color:var(--red);background:transparent}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.file{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:1px dashed var(--accent);border-radius:6px;color:var(--accent);font-weight:600;cursor:pointer;text-align:center}
.file input{display:none}
.tag{font-family:var(--font-mono);font-size:12px;padding:2px 8px;border:1px solid var(--rule);border-radius:3px;color:var(--ink-2);white-space:nowrap}
.tag.ex{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.checks{display:grid;gap:12px}
.checks label{display:flex;gap:12px;align-items:flex-start;font-size:15px;min-height:32px}
.checks input{margin-top:3px;width:20px;height:20px;accent-color:var(--accent);flex:none}
.note{font-size:14px;color:var(--ink-2)}
.warnbar{background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink);border-radius:6px;padding:10px 14px;font-size:14px}
.warnbar b{color:var(--amber)}
.err{background:var(--red-soft);border:1px solid var(--red);border-radius:6px;padding:10px 14px;font-size:14px}

/* steps */
.page-h{display:grid;gap:6px;padding-top:4px}
.page-h h1{font-size:25px}
.step-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.step-h h2{font-size:19px}
.step-h .n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 14px var(--font-mono)}
.step{display:grid;gap:14px}
details.more{border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
details.more>summary{min-height:52px;padding:0 18px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.more>div{padding:0 18px 18px;display:grid;gap:14px}
.cta{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--bg);padding-block:10px;display:grid;gap:8px;border-top:1px solid var(--rule)}
@media (min-width:760px){.cta{bottom:0}}

/* library cards */
.tpl{display:grid;gap:12px}
.tpl-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tpl-h h3{font-size:19px;margin-right:auto}
.struct{margin:0;padding:0;list-style:none;display:grid;gap:0;border-top:1px solid var(--rule)}
.struct li{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.struct li span:last-child{color:var(--ink-2);font-size:14px}
details summary{cursor:pointer;font-weight:600;min-height:36px}
details ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--ink-2);display:grid;gap:4px}

/* progress */
.prog{display:grid;gap:12px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps span{font-family:var(--font-mono);font-size:12px;padding:4px 10px;border:1px solid var(--rule);border-radius:3px;color:var(--ink-2)}
.steps span.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.steps span.done{color:var(--accent);border-color:var(--accent)}
.bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}

/* result */
.exports{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.exports{grid-template-columns:1fr 1fr auto}}
.subtabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;min-height:50px;padding:0 18px;font-weight:600;color:var(--ink-2);white-space:nowrap;cursor:pointer;font-size:15px}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.doc{display:grid;gap:22px}
.doc h2{font-size:23px}
.ed{outline:none;border-radius:3px;padding:2px 4px;margin:-2px -4px;white-space:pre-wrap;overflow-wrap:anywhere}
.ed:focus{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.pass{display:grid;gap:14px;margin:0;grid-template-columns:1fr;border:1px solid var(--rule);padding:14px;border-radius:6px;background:var(--bg)}
@media (min-width:640px){.pass{grid-template-columns:1fr 1fr}}
.pass>div{display:grid;gap:2px;min-width:0}
.cols{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.cols{grid-template-columns:1fr 1fr}}
.cols>div{min-width:0;border:1px solid var(--rule);border-radius:6px;padding:14px}
.cols ul,.doc ul{margin:8px 0 0;padding-left:20px;display:grid;gap:8px}
.stage{display:grid;gap:10px;grid-template-columns:1fr;padding:14px;border:1px solid var(--rule);border-radius:6px;border-top:3px solid var(--accent)}
.stage>div{min-width:0;display:grid;gap:2px;align-content:start}
.stage .st-t{font-weight:600}
@media (min-width:900px){.stage{grid-template-columns:1.1fr 2fr 1.4fr 1fr}}
.code{font-family:var(--font-mono);font-size:13px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;margin:0;overflow-x:auto;white-space:pre-wrap}
.sec{display:grid;gap:10px}
.sec h3{font-size:18px}
.case{background:var(--amber-soft);border:1px solid var(--amber);border-radius:6px;padding:16px;display:grid;gap:8px}
.mist{background:var(--red-soft);border:1px solid var(--red);border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.mist b{color:var(--red)}
.lvl{display:grid;gap:8px;border:1px solid var(--rule);border-radius:6px;padding:14px;min-width:0}
.lvl .tag{justify-self:start}
.ans{color:var(--accent);font-size:15px}
.slide{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.slide-scr{background:var(--slide-bg);color:var(--slide-fg);padding:20px;display:grid;gap:12px}
.slide-scr h3{font-size:20px;color:#fff}
.slide-scr .lbl{color:var(--slide-accent)}
.slide-scr ul{margin:0;padding-left:20px;display:grid;gap:6px}
.slide-scr .ex{font-family:var(--font-mono);font-size:13px;border:1px solid #2F4A3F;background:#1B2B24;border-radius:4px;padding:10px 12px;color:#E8D9A6}
.slide-nt{padding:14px 18px;display:grid;gap:4px;background:var(--surface)}
.timecard{display:grid;gap:12px}
.timecard .row{align-items:end}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;max-width:520px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:6px;font-size:15px}
#toast[hidden]{display:none}
@media (min-width:760px){#toast{bottom:24px}}
</style>

<div class="wrap">
  <header class="head">
    <svg class="logo" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 8h26M17 8v20M7 15h6M21 15h6M7 21h4M23 21h4"/>
    </svg>
    <div class="brand"><b>SmartУстаз</b><span data-i18n="brand_sub"></span></div>
    <div class="seg" role="group" aria-label="Тіл / Язык">
      <button type="button" data-lang="ru" aria-pressed="true">РУС</button>
      <button type="button" data-lang="kk" aria-pressed="false">ҚАЗ</button>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" data-i18n-aria="theme">
      <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </header>
  <div class="ai-state" id="aiState"><i></i><span></span></div>
  <details class="more" style="margin-top:8px"><summary>Ключ OpenRouter и модель</summary><div><div class="field"><label for="orKey">API-ключ OpenRouter</label><input type="password" id="orKey" autocomplete="off" placeholder="sk-or-v1-..."></div><div class="field"><label for="orModel">Модель (бесплатная, с пометкой :free)</label><input type="text" id="orModel" autocomplete="off"></div><p class="note">Ключ хранится только в вашем браузере и отправляется только на openrouter.ai. В репозиторий он не попадает.</p><div class="btns"><button class="btn" id="orSave" type="button">Сохранить</button><button class="btn ghost" id="orClear" type="button">Удалить ключ</button></div></div></details>

  <nav class="tabs" role="tablist">
    <button role="tab" id="t-new" data-go="new" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></svg>
      <span data-i18n="tab_new"></span></button>
    <button role="tab" id="t-lib" data-go="lib" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>
      <span data-i18n="tab_lib"></span></button>
    <button role="tab" id="t-res" data-go="res" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l5 5v13H6V3zM14 3v5h5M9 13h7M9 17h7"/></svg>
      <span data-i18n="tab_res"></span></button>
  </nav>

  <!-- СОЗДАТЬ -->
  <main class="view" id="v-new">
    <div class="page-h">
      <div class="lbl" data-i18n="c_kicker"></div>
      <h1 data-i18n="c_title"></h1>
    </div>

    <section class="sheet step">
      <div class="step-h"><span class="n">1</span><h2 data-i18n="s1_t"></h2></div>
      <p class="note" data-i18n="s1_p"></p>
      <div class="field"><label for="profSel" data-i18n="f_prof"></label><select id="profSel"></select></div>
      <div class="row two">
        <div class="field"><label for="fSpec" data-i18n="f_spec"></label><input type="text" id="fSpec"></div>
        <div class="field"><label for="fMod" data-i18n="f_mod"></label><input type="text" id="fMod"></div>
      </div>
    </section>

    <section class="sheet step">
      <div class="step-h"><span class="n">2</span><h2 data-i18n="s2_t"></h2></div>
      <p class="note" data-i18n="s2_p"></p>
      <div class="row two">
        <div class="field"><label for="fPlanTpl" data-i18n="f_plan_tpl"></label><select id="fPlanTpl"></select></div>
        <div class="field"><label for="fNotesTpl" data-i18n="f_notes_tpl"></label><select id="fNotesTpl"></select></div>
      </div>
    </section>

    <section class="sheet step">
      <div class="step-h"><span class="n">3</span><h2 data-i18n="s3_t"></h2></div>
      <div class="field"><label for="fTopic" data-i18n="f_topic"></label><textarea id="fTopic" style="min-height:84px"></textarea></div>
      <div class="row two">
        <div class="field"><label for="fType" data-i18n="f_type"></label>
          <select id="fType"><option value="combined" data-i18n="ty_combined"></option><option value="lab" data-i18n="ty_lab"></option><option value="lecture" data-i18n="ty_lecture"></option><option value="seminar" data-i18n="ty_seminar"></option></select></div>
        <div class="field"><label for="fLen" data-i18n="f_len"></label>
          <select id="fLen"><option value="90" data-i18n="len90"></option><option value="45" data-i18n="len45"></option><option value="135" data-i18n="len135"></option></select></div>
      </div>
      <div class="row two">
        <div class="field"><label for="fLevel" data-i18n="f_level"></label>
          <select id="fLevel"><option value="basic" data-i18n="lv_basic"></option><option value="mid" data-i18n="lv_mid" selected></option><option value="adv" data-i18n="lv_adv"></option></select></div>
        <div class="field"><label for="fLang" data-i18n="f_lang"></label>
          <select id="fLang"><option value="ru" data-i18n="lang_ru"></option><option value="kk" data-i18n="lang_kk"></option></select></div>
      </div>
    </section>

    <details class="more">
      <summary data-i18n="more"></summary>
      <div>
        <div class="field"><label for="fCtx" data-i18n="f_ctx"></label><textarea id="fCtx" data-i18n-ph="ctx_ph"></textarea></div>
        <div class="checks">
          <label><input type="checkbox" id="cCase" checked><span data-i18n="q_case"></span></label>
          <label><input type="checkbox" id="cErr" checked><span data-i18n="q_err"></span></label>
          <label><input type="checkbox" id="cLvl" checked><span data-i18n="q_lvl"></span></label>
        </div>
      </div>
    </details>

    <div class="warnbar"><b data-i18n="warn_b"></b> <span data-i18n="warn_t"></span></div>
    <div id="genErr" class="err" hidden></div>
    <div id="genProg" class="prog sheet" hidden>
      <div class="steps"><span id="s1" data-i18n="st1"></span><span id="s2" data-i18n="st2"></span><span id="s3" data-i18n="st3"></span></div>
      <div class="bar"><i></i></div>
      <div class="note" id="progChars"></div>
      <div class="btns"><button class="btn ghost" id="genStop" type="button" data-i18n="stop"></button></div>
    </div>
    <div class="cta">
      <button class="btn wide" id="genGo" type="button" data-i18n="go"></button>
      <p class="note" data-i18n="go_note"></p>
    </div>
  </main>

  <!-- ОБРАЗЦЫ -->
  <section class="view" id="v-lib" hidden>
    <div class="sheet" style="display:grid;gap:14px">
      <div class="lbl" data-i18n="l_kicker"></div>
      <h1 style="font-size:25px" data-i18n="l_title"></h1>
      <p class="lead" data-i18n="l_lead"></p>
      <div class="btns">
        <label class="file"><span data-i18n="l_file"></span><input type="file" id="file" accept=".docx,.txt,.md,.csv"></label>
      </div>
      <div class="field">
        <label for="src" data-i18n="l_src"></label>
        <textarea id="src" data-i18n-ph="l_src_ph"></textarea>
        <span class="note" id="srcCount"></span>
      </div>

  function parseLoose(text) {
    var s = String(text).trim();
    try { return JSON.parse(s); } catch (e) { /* not plain JSON */ }
    var m = s.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (m) { try { return JSON.parse(m[1]); } catch (e) { /* try next way */ } }
    var idx = [s.indexOf('{'), s.indexOf('[')].filter(function (i) { return i >= 0; });
    var b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
    if (idx.length && b > Math.min.apply(null, idx)) {
      try { return JSON.parse(s.slice(Math.min.apply(null, idx), b + 1)); } catch (e) { /* give up below */ }
    }
    throw mkErr('invalid_json');
  }

      method: 'POST',

      signal: opts.signal

      if (!res.ok) throw mkErr(res.status === 401 || res.status === 403 ? 'session_expired' : res.status === 429 ? 'rate_limited' : 'upstream_error');
      return res.json();
    }).then(function (j) {

      if (!text || !String(text).trim()) throw mkErr('empty_completion');

      if (e && e.name === 'AbortError') throw mkErr('cancelled');
      if (e && e.code) throw e;
      throw mkErr('upstream_error');
    });
  }

      theory: arr(n.theory).map(function (x) { x = x || {}; return { heading: str(x.heading), content: str(x.content), example: str(x.example) }; }),
      caseTitle: str(c.title), caseText: str(c.text),
      mistakes: arr(n.mistakes).map(function (m) { m = m || {}; return { mistake: str(m.mistake), fix: str(m.fix) }; }),
      tasks: arr(n.tasks).map(function (x) { x = x || {}; return { level: str(x.level), task: str(x.task), answer: str(x.answer) }; }),
      quiz: arr(n.quiz).map(function (q) { q = q || {}; return { question: str(q.question), answer: str(q.answer) }; })
    };
  }
  function normSlides(s) {
    var l = Array.isArray(s) ? s : arr(s && s.slides);
    return l.map(function (x) { x = x || {}; return { title: str(x.title), bullets: arr(x.bullets).map(str), example: str(x.example), notes: str(x.notes) }; });
  }
  $('#genStop').addEventListener('click', function () { if (ctl) ctl.abort(); });
  $('#genGo').addEventListener('click', async function () {
    var err = $('#genErr'); err.hidden = true;
    var v = formVals();
    if (v.topic.length < 5) { err.textContent = t('e_topic'); err.hidden = false; return; }
    if (!keyNow()) { err.textContent = t('e_noai'); err.hidden = false; return; }
    ctl = new AbortController();
    $('#genProg').hidden = false; $('#genGo').disabled = true; setStep(1);
    $('#genProg').scrollIntoView({ block: 'center' });
    var t0 = Date.now(), pT = tplById($('#fPlanTpl').value), nT = tplById($('#fNotesTpl').value);
    try {
      var planPrompt = rules(v) + tplHint(pT, 'план занятия') +
        '\nСоставь поурочный план. Этапы должны в сумме давать ровно ' + v.len + ' минут, время указывай в названии этапа в скобках. Практика занимает не меньше трети времени. Цели в формате «Образовательная / Развивающая / Воспитательная», критерии оценивания измеримы.\n' +
        'Формат JSON: {"topic":"","specialty":"","module":"","lessonType":"","methods":"","goals":["",""],"criteria":["",""],"stages":[{"stage":"1. Название (N мин)","teacher":"что делает преподаватель","students":"что делают студенты","resources":"ресурсы и формы оценивания"}],"homework":""}';
      var plan = normPlan(await ask(planPrompt, 1));
      if (!plan.stages.length) { var e1 = new Error('x'); e1.code = 'invalid_json'; throw e1; }

      var notesPrompt = rules(v) + tplHint(nT, 'конспект') +
        '\nПлан занятия уже составлен: ' + JSON.stringify(plan.stages.map(function (s) { return s.stage; })) + '. Напиши опорный конспект к этому занятию: ' +
        'два содержательных раздела теории, в каждом поле example с примером, расчётом, схемой или кодом.' +
        (v.cCase ? ' Добавь реальный кейс из практики предприятия (названия вымышленные) с вопросами для обсуждения.' : ' Поле case оставь с пустыми строками.') +
        (v.cErr ? ' Добавь три типичные ошибки студентов с объяснением, как правильно.' : ' Поле mistakes оставь пустым списком.') +
        (v.cLvl ? ' Добавь три задания уровней A, B, C и для каждого эталонный ответ для преподавателя с расчётом.' : ' Добавь одно практическое задание с ответом.') +
        ' Добавь три вопроса мини-теста с эталонными ответами.\n' +
        'Формат JSON: {"theory":[{"heading":"","content":"","example":""}],"case":{"title":"","text":""},"mistakes":[{"mistake":"","fix":""}],"tasks":[{"level":"Уровень A (базовый)","task":"","answer":""}],"quiz":[{"question":"","answer":""}]}';
      var notes = normNotes(await ask(notesPrompt, 2));

      var slidesPrompt = rules(v) +
        '\nСделай шесть слайдов презентации для этого занятия. Тезисы короткие, на слайде не больше четырёх тезисов. Поле example содержит расчёт, схему, код или пример для экрана. В поле notes дай живую речь преподавателя на 2–3 предложения. Последний слайд про практику и типичные ошибки.\n' +
        'План занятия: ' + JSON.stringify(plan.stages.map(function (s) { return s.stage; })) + '. Заголовки разделов конспекта: ' + JSON.stringify(notes.theory.map(function (x) { return x.heading; })) + '.\n' +
        'Формат JSON: [{"title":"","bullets":["","","",""],"example":"","notes":""}]';
      var slides = normSlides(await ask(slidesPrompt, 3));
      if (!slides.length) { var e2 = new Error('x'); e2.code = 'invalid_json'; throw e2; }

      cur = { example: false, ms: Date.now() - t0, manual: '', logged: false, plan: plan, notes: notes, slides: slides, tpls: [pT && pT.name, nT && nT.name].filter(Boolean) };
      sub = 'plan'; renderRes(); go('res');
    } catch (e) {
      if (e && e.code === 'cancelled') toast(t('tt_stopped'));
      else { err.textContent = errCopy(e); err.hidden = false; }
    } finally {
      $('#genProg').hidden = true; $('#genGo').disabled = aiState === 'off';
    }
  });

  /* ---------- result rendering ---------- */
  function ed(path, val, cls, tag) {
    tag = tag || 'div';
    return '<' + tag + ' class="ed ' + (cls || '') + '" contenteditable="true" spellcheck="false" data-p="' + esc(path) + '">' + esc(val) + '</' + tag + '>';
  }
  function setPath(o, path, val) {
    var p = path.split('.'), k;
    for (var i = 0; i < p.length - 1; i++) { k = /^\d+$/.test(p[i]) ? +p[i] : p[i]; if (o[k] == null) return; o = o[k]; }
    k = /^\d+$/.test(p[p.length - 1]) ? +p[p.length - 1] : p[p.length - 1];
    o[k] = val;
  }
  function renderPlan() {
    var p = cur.plan;
    return '<div class="doc">' +
      '<div class="sec"><div class="lbl">' + esc(t('d_plan')) + '</div>' + ed('plan.topic', p.topic, '', 'h2') + '</div>' +
      '<div class="pass">' +
      '<div><span class="lbl">' + esc(t('d_spec')) + '</span>' + ed('plan.specialty', p.specialty) + '</div>' +
      '<div><span class="lbl">' + esc(t('d_mod')) + '</span>' + ed('plan.module', p.module) + '</div>' +
      '<div><span class="lbl">' + esc(t('d_type')) + '</span>' + ed('plan.lessonType', p.lessonType) + '</div>' +
      '<div><span class="lbl">' + esc(t('d_meth')) + '</span>' + ed('plan.methods', p.methods) + '</div></div>' +
      '<div class="cols"><div><div class="lbl">' + esc(t('d_goals')) + '</div><ul>' + p.goals.map(function (g, i) { return '<li>' + ed('plan.goals.' + i, g) + '</li>'; }).join('') + '</ul></div>' +
      '<div><div class="lbl">' + esc(t('d_crit')) + '</div><ul>' + p.criteria.map(function (g, i) { return '<li>' + ed('plan.criteria.' + i, g) + '</li>'; }).join('') + '</ul></div></div>' +
      '<div class="sec"><div class="lbl">' + esc(t('d_course')) + '</div>' + p.stages.map(function (s, i) {
        var b = 'plan.stages.' + i + '.';
        return '<div class="stage"><div><span class="lbl">' + esc(t('d_stage')) + '</span>' + ed(b + 'stage', s.stage, 'st-t') + '</div>' +
          '<div><span class="lbl">' + esc(t('d_teacher')) + '</span>' + ed(b + 'teacher', s.teacher) + '</div>' +
          '<div><span class="lbl">' + esc(t('d_students')) + '</span>' + ed(b + 'students', s.students) + '</div>' +
          '<div><span class="lbl">' + esc(t('d_res')) + '</span>' + ed(b + 'resources', s.resources) + '</div></div>';
      }).join('') + '</div>' +
      '<div class="sec"><div class="lbl">' + esc(t('d_hw')) + '</div>' + ed('plan.homework', p.homework) + '</div></div>';
  }
  function renderNotes() {
    var n = cur.notes;
    return '<div class="doc">' +
      '<div class="sec"><div class="lbl">' + esc(t('d_notes')) + '</div><h2>' + esc(cur.plan.topic) + '</h2></div>' +
      n.theory.map(function (x, i) {
        var b = 'notes.theory.' + i + '.';
        return '<div class="sec"><h3>' + ed(b + 'heading', x.heading, '', 'span') + '</h3>' + ed(b + 'content', x.content) +
          (x.example ? ed(b + 'example', x.example, 'code', 'pre') : '') + '</div>';
      }).join('') +
      (n.caseText ? '<div class="case"><div class="lbl">' + esc(t('d_case')) + '</div><h3>' + ed('notes.caseTitle', n.caseTitle, '', 'span') + '</h3>' + ed('notes.caseText', n.caseText) + '</div>' : '') +
      (n.mistakes.length ? '<div class="sec"><div class="lbl">' + esc(t('d_mist')) + '</div>' + n.mistakes.map(function (m, i) {
        var b = 'notes.mistakes.' + i + '.';
        return '<div class="mist"><b>' + ed(b + 'mistake', m.mistake, '', 'span') + '</b><div><span class="lbl">' + esc(t('d_right')) + '</span> ' + ed(b + 'fix', m.fix, '', 'span') + '</div></div>';
      }).join('') + '</div>' : '') +
      (n.tasks.length ? '<div class="sec"><div class="lbl">' + esc(t('d_tasks')) + '</div>' + n.tasks.map(function (x, i) {
        var b = 'notes.tasks.' + i + '.';
        return '<div class="lvl"><span class="tag">' + esc(x.level) + '</span>' + ed(b + 'task', x.task) +
          '<details><summary>' + esc(t('d_answer')) + '</summary><div class="ans">' + ed(b + 'answer', x.answer) + '</div></details></div>';
      }).join('') + '</div>' : '') +
      (n.quiz.length ? '<div class="sec"><div class="lbl">' + esc(t('d_quiz')) + '</div>' + n.quiz.map(function (q, i) {
        var b = 'notes.quiz.' + i + '.';
        return '<div class="lvl"><b>' + ed(b + 'question', q.question, '', 'span') + '</b><div class="ans"><span class="lbl">' + esc(t('d_ans')) + '</span> ' + ed(b + 'answer', q.answer, '', 'span') + '</div></div>';
      }).join('') + '</div>' : '') + '</div>';
  }
  function renderSlides() {
    return '<div class="doc">' + cur.slides.map(function (s, i) {
      var b = 'slides.' + i + '.';
      return '<div class="slide"><div class="slide-scr"><div class="lbl">' + esc(t('d_slide')) + ' ' + (i + 1) + '</div><h3>' + ed(b + 'title', s.title, '', 'span') + '</h3>' +
        '<ul>' + s.bullets.map(function (x, j) { return '<li>' + ed(b + 'bullets.' + j, x, '', 'span') + '</li>'; }).join('') + '</ul>' +
        (s.example ? ed(b + 'example', s.example, 'ex') : '') + '</div>' +
        '<div class="slide-nt"><span class="lbl">' + esc(t('d_speech')) + '</span>' + ed(b + 'notes', s.notes) + '</div></div>';
    }).join('') + '</div>';
  }
  function fmtMin(m) {
    m = Math.round(m); var a = Math.abs(m), h = Math.floor(a / 60), r = a % 60;
    return (m < 0 ? '−' : '') + (h ? h + ' ' + t('u_h') + ' ' : '') + r + ' ' + t('u_m');
  }
  function logSummary() {
    if (!log.length) return t('tm_sum0');
    var saved = log.reduce(function (a, x) { return a + (x.manual - x.ms / 60000); }, 0);
    return t('tm_sum', { n: log.length, t: fmtMin(saved) });
  }
  function timeCard() {
    if (cur.example) return '<div class="sheet note">' + esc(t('tm_demo')) + '</div>';
    var sec = Math.round(cur.ms / 1000), ts = Math.floor(sec / 60) + ' ' + t('u_m') + ' ' + (sec % 60) + ' ' + t('u_s');
    return '<div class="sheet timecard"><div class="lbl">' + esc(t('tm_t')) + '</div>' +
      '<p>' + esc(t('tm_p', { t: ts })) + '</p>' +
      '<div class="row two"><div class="field"><label for="manual">' + esc(t('tm_min')) + '</label>' +
      '<input type="number" id="manual" min="1" max="1000" inputmode="numeric" value="' + esc(cur.manual) + '"></div>' +
      '<button class="btn ghost" type="button" data-act="log"' + (cur.logged ? ' disabled' : '') + '>' + esc(cur.logged ? t('tm_logged') : t('tm_log')) + '</button></div>' +
      '<p class="note">' + esc(logSummary()) + '</p></div>';
  }
  function renderRes() {
    var body = sub === 'plan' ? renderPlan() : sub === 'notes' ? renderNotes() : renderSlides();
    $('#resRoot').innerHTML =
      '<div class="warnbar"><b>' + esc(cur.example ? t('r_demo_b') : t('r_draft_b')) + '</b> ' + esc(cur.example ? t('r_demo_t') : t('r_draft_t')) + ' ' +
      (cur.tpls && cur.tpls.length ? esc(t('r_built', { n: cur.tpls.join(', ') })) + ' ' : '') + esc(t('r_edit')) + '</div>' +
      '<div class="exports"><button class="btn" type="button" data-act="docx">' + esc(t('r_docx')) + '</button>' +
      '<button class="btn" type="button" data-act="pptx">' + esc(t('r_pptx')) + '</button>' +
      '<button class="btn ghost" type="button" data-act="new">' + esc(t('r_new')) + '</button></div>' +
      timeCard() +
      '<div class="subtabs" role="tablist">' + [['plan', t('sb_plan')], ['notes', t('sb_notes')], ['slides', t('sb_slides', { n: cur.slides.length })]].map(function (x) {
        return '<button role="tab" data-sub="' + x[0] + '" aria-selected="' + (sub === x[0]) + '">' + esc(x[1]) + '</button>';
      }).join('') + '</div>' +
      '<div class="sheet">' + body + '</div>';
  }
  $('#resRoot').addEventListener('input', function (e) {
    var el = e.target.closest('[data-p]');
    if (el) { setPath(cur, el.dataset.p, el.innerText.replace(/\n{3,}/g, '\n\n').replace(/\s+$/, '')); return; }
    if (e.target.id === 'manual') cur.manual = e.target.value;
  });
  $('#resRoot').addEventListener('click', function (e) {
    var s = e.target.closest('[data-sub]');
    if (s) { sub = s.dataset.sub; renderRes(); return; }
    var a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'docx') exportDocx();
    else if (a.dataset.act === 'pptx') exportPptx();
    else if (a.dataset.act === 'new') go('new');
    else if (a.dataset.act === 'log') {
      var m = parseFloat(cur.manual);
      if (!(m > 0)) { toast(t('tt_manual')); return; }
      log.push({ date: Date.now(), topic: cur.plan.topic.slice(0, 80), manual: m, ms: cur.ms });
      store.set('su_log_v1', log); cur.logged = true; cur.manual = String(m); renderRes();
      toast(t('tt_logged', { t: fmtMin(m - cur.ms / 60000) }));
    }
  });

  /* ---------- export ---------- */
  function fname(ext) { return (cur.plan.topic || 'lesson').replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 50) + ext; }
  function saveFile(name, data) {
    if (!dl) { toast(t('tt_nodl')); return; }
    dl.save({ filename: name, data: data }).then(function () { toast(t('tt_fsaved')); }).catch(function (e) {
      if (e && e.code === 'declined') return;
      toast(t('tt_fail'));
    });
  }
  function lines(x) { return str(x).split(/\n+/).filter(function (y) { return y.trim(); }); }
  async function exportDocx() {
    var X = window.docx;
    if (!X) { toast(t('tt_docx_lib')); return; }
    try {
      var p = cur.plan, n = cur.notes, ch = [];
      var H1 = function (x) { return new X.Paragraph({ text: x, heading: X.HeadingLevel.HEADING_1, spacing: { before: 200, after: 120 } }); };
      var H2 = function (x) { return new X.Paragraph({ text: x, heading: X.HeadingLevel.HEADING_2, spacing: { before: 200, after: 80 } }); };
      var P = function (x, o) { return lines(x).map(function (l) { return new X.Paragraph({ children: [new X.TextRun(Object.assign({ text: l }, o || {}))], spacing: { after: 80 } }); }); };
      var B = function (x) { return new X.Paragraph({ text: x, bullet: { level: 0 } }); };
      var cell = function (x, bold) { var c = P(x, bold ? { bold: true } : {}); return new X.TableCell({ children: c.length ? c : [new X.Paragraph('')] }); };
      ch.push(H1(t('d_plan') + ': ' + p.topic));
      ch = ch.concat(P(t('d_spec') + ': ' + p.specialty), P(t('d_mod') + ': ' + p.module), P(t('d_type') + ': ' + p.lessonType), P(t('d_meth') + ': ' + p.methods));
      ch.push(H2(t('d_goals'))); p.goals.forEach(function (g) { ch.push(B(g)); });
      ch.push(H2(t('d_crit'))); p.criteria.forEach(function (g) { ch.push(B(g)); });
      ch.push(H2(t('d_course')));
      ch.push(new X.Table({
        width: { size: 100, type: X.WidthType.PERCENTAGE },
        rows: [new X.TableRow({ tableHeader: true, children: [t('d_stage'), t('d_teacher'), t('d_students'), t('d_res')].map(function (h) { return cell(h, true); }) })]
          .concat(p.stages.map(function (s) { return new X.TableRow({ children: [cell(s.stage, true), cell(s.teacher), cell(s.students), cell(s.resources)] }); }))
      }));
      ch.push(H2(t('d_hw'))); ch = ch.concat(P(p.homework));
      ch.push(new X.Paragraph({ children: [new X.PageBreak()] }));
      ch.push(H1(t('d_notes')));
      n.theory.forEach(function (x) {
        ch.push(H2(x.heading)); ch = ch.concat(P(x.content));
        if (x.example) ch = ch.concat(P(x.example, { font: 'Courier New', size: 21 }));
      });
      if (n.caseText) { ch.push(H2(t('d_case') + ': ' + n.caseTitle)); ch = ch.concat(P(n.caseText)); }
      if (n.mistakes.length) { ch.push(H2(t('d_mist'))); n.mistakes.forEach(function (m) { ch = ch.concat(P(m.mistake, { bold: true }), P(t('d_right') + ': ' + m.fix)); }); }
      if (n.tasks.length) { ch.push(H2(t('d_tasks'))); n.tasks.forEach(function (x) { ch = ch.concat(P(x.level, { bold: true }), P(x.task), P(t('d_answer') + ': ' + x.answer, { italics: true })); }); }
      if (n.quiz.length) { ch.push(H2(t('d_quiz'))); n.quiz.forEach(function (q, i) { ch = ch.concat(P((i + 1) + '. ' + q.question, { bold: true }), P(t('d_ans') + ': ' + q.answer, { italics: true })); }); }
      ch.push(new X.Paragraph({ children: [new X.TextRun({ text: t('d_footer'), italics: true, size: 18 })], spacing: { before: 300 } }));
      var doc = new X.Document({ sections: [{ children: ch }] });
      var blob = await X.Packer.toBlob(doc);
      saveFile(fname(' (' + t('dt_plan').toLowerCase() + ').docx'), blob);
    } catch (e) { toast(t('tt_docx_fail')); }
  }
  async function exportPptx() {
    if (!window.PptxGenJS) { toast(t('tt_pptx_lib')); return; }
    try {
      var x = new window.PptxGenJS();
      x.layout = 'LAYOUT_16x9'; x.title = cur.plan.topic;
      cur.slides.forEach(function (s, i) {
        var sl = x.addSlide(); sl.background = { color: '14201B' };
        sl.addText(t('d_slide') + ' ' + (i + 1) + '  |  ' + (cur.plan.module || ''), { x: 0.6, y: 0.35, w: 8.8, h: 0.3, fontSize: 11, color: '7CCBB0', bold: true, fontFace: 'Arial' });
        sl.addText(s.title, { x: 0.6, y: 0.75, w: 8.8, h: 0.9, fontSize: 24, color: 'FFFFFF', bold: true, fontFace: 'Arial', valign: 'top' });
        sl.addText(s.bullets.map(function (b) { return { text: b, options: { bullet: true, breakLine: true } }; }), { x: 0.6, y: 1.75, w: 8.8, h: 2.3, fontSize: 16, color: 'E6EEE9', fontFace: 'Arial', valign: 'top', paraSpaceAfter: 6 });
        if (s.example) {
          sl.addShape(x.ShapeType.rect, { x: 0.6, y: 4.2, w: 8.8, h: 0.95, fill: { color: '1B2B24' }, line: { color: '58B79B', width: 1 } });
          sl.addText(s.example, { x: 0.75, y: 4.25, w: 8.5, h: 0.85, fontSize: 12, color: 'E8D9A6', fontFace: 'Courier New', valign: 'middle' });
        }
        if (s.notes) sl.addNotes(s.notes);
      });
      var out = await x.write({ outputType: 'blob' });
      saveFile(fname(' (' + t('dt_slides').toLowerCase() + ').pptx'), out);
    } catch (e) { toast(t('tt_pptx_fail')); }
  }

  /* ---------- language / profession wiring ---------- */
  function applyI18n() {
    document.documentElement.lang = lang === 'kk' ? 'kk' : 'ru';
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    $$('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.dataset.i18nPh); });
    $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    $$('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    $('#fLang').value = lang;
    fillProfSelect(); fillForm(false); srcCount(); syncAi();
    if (cur.example) cur = clone(DEMO[lang]);
    renderLib(); renderRes();
  }
  $$('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.lang === lang) return;
      lang = b.dataset.lang; store.set('su_lang', lang); applyI18n();
    });
  });
  $('#profSel').addEventListener('change', function () {
    profId = this.value; store.set('su_prof', profId); fillForm(true);
    if (profId === 'other') $('#fSpec').focus();
  });

  syncTheme();
  $('#orKey').value = keyNow();
  $('#orModel').value = modelNow();
  $('#orSave').addEventListener('click', function () {
    var k = $('#orKey').value.trim();
    var m = $('#orModel').value.trim() || 'openrouter/free';
    store.set('or_key', k); store.set('or_model', m); refreshAi();
    toast(k ? t('or_saved') : t('or_empty'));
  });
  $('#orClear').addEventListener('click', function () {
    store.set('or_key', ''); $('#orKey').value = ''; refreshAi(); toast(t('or_cleared'));
  });
  refreshAi();

  applyI18n();
})();

</script>

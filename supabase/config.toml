project_id = "smartustaz"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = ["http://localhost:8000"]
enable_signup = true

[functions.ai-generate]
verify_jwt = true

[functions.telegram-link]
verify_jwt = true

[functions.telegram-webhook]
verify_jwt = false
